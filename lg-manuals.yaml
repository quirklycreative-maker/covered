# LG India owner's manuals for the models covered by the three LG washing-machine packs.
# Not a pack and not checked by validate.py: it is a reference index so the app and the RAG build can link to, or fetch, the source manuals.
#
# How to use:
#   - support_page is the stable LG India page for the model. If a pdf_url stops working, open support_page and copy the new Owner's Manual link.
#   - pdf_url was fetched on 25 Oct 2026 and returned a real PDF (checked: %PDF header, size, sha256 below). sha256 lets you detect that LG replaced the file.
#   - online_manual_url is LG's HTML manual. It was read from LG's page but NOT opened or downloaded, so treat it as unchecked.
#   - Some models share one manual file (shared_with). Pack lines marked VERIFIED cite these manuals by section name.
#   - The PDFs themselves are LG's copyright and are NOT stored in this repository; they were saved locally in Downloads\lg-manuals\.
