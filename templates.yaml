# Covered: India claim templates, data file. Version 0.3.0 (draft).
# Rebuilt 10 Oct 2026 from draft 0.1.0 after the Section A to E answers.
# Rules: every {placeholder} is in field_catalog or in the template's own slots.
#        every English text has a Hindi twin with the same placeholders.
#        Hindi: bracketed English for formal terms; no gendered verb pairs (करता/करती).
# This is information, not legal advice. The user decides whether to send or file anything.

pack: {id: templates-in, version: 0.3.0, status: draft, languages: [en, hi], hindi_review: pending}

# What the e-Jagriti upload step asks for, mapped to a template (rule ejagriti_documents).
ejagriti_bundle:
  - {upload: Index, template: index}
  - {upload: Proforma, template: district_commission_complaint, assumption: "Read as the complaint set out in the NCDRC proforma order. Unconfirmed; the manual does not define it."}
  - {upload: Synopsis, template: synopsis_list_of_dates}
  - {upload: Memo of Parties, template: memo_of_parties}
  - {upload: Notarized Affidavit, template: affidavit}
  - {upload: Vakalatnama, template: null, note: {en: "Only when the user chooses to file through an advocate (routes.filing_mode). The advocate supplies it; Covered gives no template. A self-filing user skips it.", hi: "केवल तब, जब उपयोगकर्ता अधिवक्ता (advocate) के ज़रिए दर्ज करना चुने (routes.filing_mode)। वकालतनामा अधिवक्ता देते हैं; Covered कोई टेम्पलेट नहीं देता। खुद दर्ज करने वाला इसे छोड़ देता है।"}}
  - {upload: Annexures, template: null, note: {en: "Your own files: bill, warranty card, photos, service records, letters. Label them Annexure A-1, A-2 and so on.", hi: "आपके अपने कागज़: बिल, वारंटी कार्ड, फ़ोटो, सर्विस रिकॉर्ड, पत्र। इन्हें अनुलग्नक (Annexure) A-1, A-2 आदि नाम दें।"}}

field_catalog:
  date: {en: "Date", hi: "दिनांक", kind: date}
  place: {en: "Place", hi: "स्थान", kind: text}
  filing_date: {en: "Date of filing", hi: "दाखिल करने की तारीख", kind: date}
  user_name: {en: "Your full name", hi: "आपका पूरा नाम", kind: text}
  user_address: {en: "Your address", hi: "आपका पता", kind: text}
  user_phone: {en: "Your phone", hi: "आपका फ़ोन", kind: text}
  user_email: {en: "Your email", hi: "आपका ईमेल", kind: text}
  user_age: {en: "Your age", hi: "आपकी आयु", kind: number}
  user_relation_line: {en: "Relation line, e.g. son of Shri X, daughter of Shri X, wife of Shri X", hi: "संबंध की पंक्ति, जैसे पुत्र श्री क, पुत्री श्री क, पत्नी श्री क", kind: text}
  brand: {en: "Brand", hi: "ब्रांड", kind: text}
  brand_address: {en: "Brand's registered or service address", hi: "ब्रांड का पंजीकृत या सर्विस पता", kind: text}
  seller_name: {en: "Seller's name", hi: "विक्रेता का नाम", kind: text}
  seller_address: {en: "Seller's address", hi: "विक्रेता का पता", kind: text}
  seller_email: {en: "Seller's email", hi: "विक्रेता का ईमेल", kind: text}
  seller_phone: {en: "Seller's phone", hi: "विक्रेता का फ़ोन", kind: text}
  product: {en: "Product", hi: "उत्पाद", kind: text}
  model: {en: "Model", hi: "मॉडल", kind: text}
  serial: {en: "Serial number", hi: "सीरियल नंबर", kind: text}
  invoice_no: {en: "Invoice number", hi: "बिल नंबर", kind: text}
  purchase_date: {en: "Purchase date", hi: "खरीद की तारीख", kind: date}
  price_inr: {en: "Price paid, in rupees", hi: "चुकाई गई कीमत, रुपये में", kind: number}
  warranty_until: {en: "Warranty end date", hi: "वारंटी समाप्ति की तारीख", kind: date}
  warranty_start_text: {en: "Warranty start (purchase date or installation date)", hi: "वारंटी की शुरुआत (खरीद की तारीख या इंस्टॉलेशन की तारीख)", kind: text}
