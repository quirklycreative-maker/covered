- id: affidavit
  order: 9
  title: {en: "Affidavit in support of the complaint (to be notarised)", hi: "शिकायत के समर्थन में शपथ-पत्र (Affidavit), नोटरी से सत्यापित कराने के लिए"}
  note:
    en: "Treated as required: the e-Jagriti manual lists a Notarized Affidavit. Print it, sign it before a notary, and scan it. The notary completes the last block. Whether stamp paper is needed, and the notary's fee, vary by place; one first-hand post reports Rs 200. Not verified."
    hi: "अनिवार्य माना गया है: e-Jagriti की मैनुअल में नोटरी से सत्यापित शपथ-पत्र (Notarized Affidavit) अपलोड की सूची में है। इसे प्रिंट करें, नोटरी के सामने हस्ताक्षर करें और स्कैन करें। अंतिम खंड नोटरी भरते हैं। स्टाम्प पेपर चाहिए या नहीं और नोटरी की फ़ीस जगह के अनुसार बदलती है; एक उपभोक्ता की पोस्ट में 200 रुपये बताए गए हैं। असत्यापित।"
  rules: [ejagriti_documents, ejagriti_affidavit_notarised]
  body:
