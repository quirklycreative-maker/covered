  service_request_no: {en: "Latest service request number", hi: "सबसे ताज़ा सर्विस शिकायत नंबर", kind: text}
  gap_statement: {en: "What is still unresolved and what the company has not done", hi: "क्या अब भी हल नहीं हुआ और कंपनी ने क्या नहीं किया", kind: text}
